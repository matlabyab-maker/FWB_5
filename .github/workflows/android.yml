```yaml
name: FWB_5 Android Build

on:
  push:
    branches: [main, master, android]
  pull_request:
    branches: [main, master, android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -o pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK root: $SDK_ROOT" | tee sdk.log

          find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager -print \
            2>&1 | tee -a sdk.log

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found" | tee -a sdk.log
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses \
            2>&1 | tee -a sdk.log || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            2>&1 | tee -a sdk.log

      - name: Set up Gradle 8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Verify project files
        shell: bash
        run: |
          set -e
          {
            pwd
            ls -la
            test -f settings.gradle
            test -f build.gradle
            test -f app/build.gradle
            test -f app/src/main/AndroidManifest.xml
            test -f app/src/main/java/com/fwb/browser/MainActivity.java
            echo "Project file checks passed."
          } 2>&1 | tee verify.log

      - name: Build Debug APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace --info assembleDebug \
            2>&1 | tee build.log
          RESULT=${PIPESTATUS[0]}
          echo "Gradle exit code: $RESULT" | tee -a build.log
          exit "$RESULT"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FWB_5-Desktop-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FWB_5-Build-Logs
          path: |
            sdk.log
            verify.log
            build.log
          if-no-files-found: warn
          retention-days: 14
```
